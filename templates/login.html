<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · Margin Lab</title><link rel="stylesheet" href="/static/css/lab.css"></head><body class="login-page"><main class="login-card"><a class="brand" href="/login"><span class="brand-mark">m</span> margin<span class="lab">LAB</span></a><div class="eyebrow">PRIVATE RESEARCH WORKSPACE</div><h1>登录研究工作台</h1><p>通过身份验证后访问研究与行情数据。</p>{% if error %}<div class="login-error" role="alert">{{ error }}</div>{% endif %}<form action="/login" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next }}"><label>用户名<input name="username" autocomplete="username" required maxlength="64" autofocus></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label><button class="primary" type="submit">登录</button></form><p class="login-note">闲置 30 分钟自动退出 · 登录最长有效 8 小时</p></main></body></html>
